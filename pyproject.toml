[project]
dynamic = ['version']
name = 'infrable'
description = "Manage Infrastructure and Configuration as a Python dev"
keywords = ['declarative', 'infrastructure', 'management', 'devops', 'ssh']
classifiers = [
  'Development Status :: 4 - Beta',
  'Environment :: Console',
  'Intended Audience :: Developers',
  'Intended Audience :: System Administrators',
  'License :: OSI Approved :: Apache Software License',
  'Operating System :: POSIX',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Topic :: System :: Systems Administration',
]
authors = [{ name = 'Arijit Basu', email = 'sayanarijit@gmail.com' }]
maintainers = [{ name = 'Arijit Basu', email = 'sayanarijit@gmail.com' }]
readme = 'README.md'
license = { file = 'LICENSE' }
requires-python = '>=3.12'
dependencies = [
  'jinja2>=3.1,<4',
  'sh>=2.4,<3',
  'typer>=0.29,<1',
  'pyyaml>=6,<7',
  'tqdm>=4.66,<5',
  'python-box>=8,<9',
  'tenacity>=9,<10',
]

[dependency-groups]
dev = [
  "flake8>=7.3.0",
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "pytest-socket>=0.8.1",
  "ruff>=0.15.17",
  "tox>=4.55.1",
  "twine>=6.2.0",
]

[project.urls]
Homepage = 'https://github.com/stckme/infrable'
Issues = 'https://github.com/stckme/infrable/issues'
Changelog = 'https://github.com/stckme/infrable/blob/main/CHANGELOG.md'
Security = 'https://github.com/stckme/infrable/blob/main/SECURITY.md'

[project.scripts]
infrable = 'infrable.cli.main:app'

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.version]
path = 'infrable/__init__.py'

[tool.pytest]
addopts = [
  '--disable-socket',
  '--cov',
  '--cov-report=html',
  '--cov-fail-under=100',
]

[tool.coverage.run]
source = ['infrable']
parallel = true
patch = ['subprocess']

[tool.ruff.lint]
select = ['E4', 'E7', 'E9', 'F', 'B', 'UP', 'I']
ignore = [
  'B008', # typer.Argument(...) in defaults is the typer idiom
  'UP045', # Optional[X] is fine, and typer-compatible
  'UP047', # PEP 695 generics
  'UP035',
]

[tool.ruff.lint.per-file-ignores]
# Re-exports for `from infrable import ...` in infra.py
'infrable/__init__.py' = ['F401']
