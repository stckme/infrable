[project]
dynamic = ['version']
name = 'infrable'
description = "Manage Infrastructure and Configuration as a Python dev"
keywords = ['declarative', 'infrastructure', 'management']
homepage = 'https://github.com/stckme/infrable'
authors = [{ name = 'Arijit Basu', email = 'sayanarijit@gmail.com' }]
maintainers = [{ name = 'Arijit Basu', email = 'sayanarijit@gmail.com' }]
readme = 'README.md'
license = { file = 'LICENSE' }
requires-python = '>=3.12'
dependencies = [
  "jinja2~=3.1.0",
  'sh~=2.4.0',
  'typer~=0.29.0',
  'pyyaml~=6.0.0',
  'tqdm~=4.70.0',
  'python-box~=8.0.0',
  "tenacity~=9.2.0",
]

[dependency-groups]
dev = [
  "flake8>=7.3.0",
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.17",
  "tox>=4.55.1",
  "twine>=6.2.0",
]

[project.urls]
Homepage = 'https://github.com/stckme/infrable'

[project.scripts]
infrable = 'infrable.cli.main:app'

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.version]
path = 'infrable/__init__.py'

[tool.pytest]
addopts = ['--cov', '--cov-report=html', '--cov-fail-under=100']
